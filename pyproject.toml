[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smarthris"
version = "0.1.0"
description = "SmartHRIS-AI — HRIS learning project (FastAPI + MySQL)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "cryptography>=44.0",
    "email-validator>=2.2",
    "fastapi>=0.115",
    "httpx>=0.28",
    "openpyxl>=3.1",
    "pydantic-settings>=2.6",
    "pymysql>=1.1",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "streamlit>=1.40",
    "uvicorn[standard]>=0.32",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28",
    "httpx2>=0.1",
    "pytest>=8.3",
]
rag-keyword = [
    "rank-bm25>=0.2.2",
]

[project.scripts]
smarthris-api = "smarthris.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "performance: large import benchmarks; skipped unless SMART_HRIS_RUN_PERFORMANCE=1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
